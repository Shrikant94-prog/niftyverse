name: offline-checks
on: [push, pull_request, workflow_dispatch]
jobs:
  behavior:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen --extra filings pytest tests/test_filings.py -q
      - run: uv run --frozen python tools/check_wheel.py --lane core
      - run: uv run --frozen python tools/check_docs.py --baseline --self-test
  extras:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lane: [yahoo, yahoo-consumer, notebook, pandas, filings]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.14"
      - run: uv run --frozen python tools/check_wheel.py --lane ${{ matrix.lane }}
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.14"
      - run: uv run --frozen python tools/check_wheel.py --lane core
