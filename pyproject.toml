[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "niftyverse"
version = "0.1.0"
description = "Local-first research data with explicit acquisition and bounded previews"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx[http2]", "msgspec", "polars", "pyarrow", "duckdb", "click", "rich",
  "filelock", "platformdirs", "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
yahoo = ["yfinance==1.7.0"]
pandas = ["pandas", "pyarrow"]
notebook = ["ipython", "ipywidgets", "plotly", "anywidget"]
# Optional bounded syntax processor; decoding requires an explicit closed taxonomy.
filings = ["lxml==6.1.3"]

[project.scripts]
niftyverse = "niftyverse.cli:main"

[dependency-groups]
dev = [
  "pytest", "pytest-asyncio", "hypothesis", "mypy", "ruff", "coverage[toml]",
  "nbclient", "nbformat", "packaging", "types-python-dateutil", "pip==26.2.1",
  "types-lxml>=2026.2.16",
]
docs = ["mkdocs"]

[tool.hatch.build.targets.wheel]
packages = ["src/niftyverse"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: explicitly authorized provider probes (excluded by default)"]

[tool.coverage.run]
source = ["niftyverse"]
